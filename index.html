<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mari Hub TA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f4f1; --surface:#ffffff; --surface-2:#faf8f6; --line:#e8e3dd; --line-2:#d9d2ca;
  --text:#1f1b18; --muted:#6f665e; --faint:#9a9088;
  --accent:#d1495b; --accent-2:#b43a4b; --accent-soft:#fbe9eb;
  --ink:#2b2340;
  --red:#d64545; --red-soft:#fde8e8; --yellow:#c98a07; --yellow-soft:#fdf3d9; --green:#2f8f5b; --green-soft:#e2f4ea;
  --blue:#3b6fd8; --blue-soft:#e6eefc;
  --shadow:0 1px 2px rgba(31,27,24,.05),0 4px 16px rgba(31,27,24,.05);
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16131a; --surface:#1f1b24; --surface-2:#25212b; --line:#332d3a; --line-2:#433b4b;
    --text:#f1ece8; --muted:#b0a6a0; --faint:#81776f;
    --accent:#ec6b7c; --accent-2:#f48896; --accent-soft:#3a2229; --ink:#e9e3ff;
    --red:#f07272; --red-soft:#3b2022; --yellow:#e5b23c; --yellow-soft:#3a3019; --green:#5cc48a; --green-soft:#1c3327;
    --blue:#7da2f0; --blue-soft:#1e2a44; --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --bg:#16131a; --surface:#1f1b24; --surface-2:#25212b; --line:#332d3a; --line-2:#433b4b;
  --text:#f1ece8; --muted:#b0a6a0; --faint:#81776f;
  --accent:#ec6b7c; --accent-2:#f48896; --accent-soft:#3a2229; --ink:#e9e3ff;
  --red:#f07272; --red-soft:#3b2022; --yellow:#e5b23c; --yellow-soft:#3a3019; --green:#5cc48a; --green-soft:#1c3327;
  --blue:#7da2f0; --blue-soft:#1e2a44; --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.45 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.nav{position:sticky;top:0;height:100vh;padding:22px 14px;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px}
.brand .logo{width:34px;height:34px;border-radius:10px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:800;font-size:15px}
.brand b{display:block;font-size:15px;letter-spacing:-.01em}
.brand small{color:var(--muted);font-size:12px}
.nav a.link{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;color:var(--muted);text-decoration:none;font-weight:600}
.nav a.link:hover{background:var(--surface-2);color:var(--text)}
.nav a.link.on{background:var(--accent-soft);color:var(--accent-2)}
.nav a.link .ic{width:18px;text-align:center}
.nav a.link .cnt{margin-left:auto;font-size:11px;background:var(--surface-2);color:var(--muted);border-radius:99px;padding:1px 7px;border:1px solid var(--line)}
.nav a.link .cnt.hot{background:var(--red);color:#fff;border-color:transparent}
.nav .spacer{flex:1}
.sync{font-size:12px;color:var(--muted);padding:8px 12px;border-radius:10px;background:var(--surface-2);display:flex;gap:8px;align-items:center}
.sync .dot{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.sync.ok .dot{background:var(--green)} .sync.err .dot{background:var(--red)} .sync.wait .dot{background:var(--yellow)}
main{padding:28px 32px 60px;min-width:0;max-width:1400px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
h1{font-size:26px;letter-spacing:-.02em;margin:0;font-weight:800}
.sub{color:var(--muted);margin-top:2px}
h2{font-size:15px;margin:0;font-weight:700;letter-spacing:-.01em}
h3{font-size:13px;margin:0 0 8px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.card-h .hint{color:var(--muted);font-size:12px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1.45fr 1fr}
.g2e{grid-template-columns:1fr 1fr}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow);cursor:default}
.kpi[data-go]{cursor:pointer}
.kpi .v{font-size:26px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi .l{color:var(--muted);font-size:12px;font-weight:600}
.kpi.alert .v{color:var(--red)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);padding:8px 13px;border-radius:10px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{background:var(--accent-2)}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--red)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar .grow{flex:1}
input.in,select.in,textarea.in{border:1px solid var(--line-2);background:var(--surface);border-radius:10px;padding:8px 11px;min-width:0;outline:none}
input.in:focus,select.in:focus,textarea.in:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea.in{resize:vertical;min-height:70px;width:100%}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:7px 12px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--ink);color:var(--surface)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap;position:sticky;top:0}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--surface-2)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.nowrap{white-space:nowrap}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:12px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--surface-2);color:var(--muted);white-space:nowrap;border:1px solid var(--line)}
.chip.red{background:var(--red-soft);color:var(--red);border-color:transparent}
.chip.yellow{background:var(--yellow-soft);color:var(--yellow);border-color:transparent}
.chip.green{background:var(--green-soft);color:var(--green);border-color:transparent}
.chip.blue{background:var(--blue-soft);color:var(--blue);border-color:transparent}
.chip.accent{background:var(--accent-soft);color:var(--accent-2);border-color:transparent}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none}
.dot.l3{background:var(--red)} .dot.l2{background:var(--yellow)} .dot.l1{background:var(--line-2)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:center;padding:11px 2px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .main{flex:1;min-width:0}
.li .t{font-weight:700}
.li .s{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis}
.prio{display:flex;gap:14px;align-items:flex-start;padding:12px;border-radius:12px;border:1px solid var(--line);margin-bottom:8px;cursor:pointer;background:var(--surface)}
.prio:hover{border-color:var(--line-2);background:var(--surface-2)}
.prio .rank{font-size:20px;font-weight:800;color:var(--faint);width:22px;text-align:center;line-height:1.2}
.prio .body{flex:1;min-width:0}
.prio .t{font-weight:700;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.prio .meta{color:var(--muted);font-size:12px;margin-top:2px}
.prio .act{margin-top:6px;font-size:12.5px;font-weight:600;color:var(--accent-2)}
.score{font-size:11px;font-weight:700;color:var(--muted);text-align:right;min-width:54px}
.bar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:4px;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.stagebar{display:grid;grid-template-columns:120px 1fr 32px;gap:10px;align-items:center;margin:7px 0;font-size:13px}
.stagebar .track{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.stagebar .track i{display:block;height:100%;background:var(--ink);opacity:.85;border-radius:99px}
.stagebar b{text-align:right;font-variant-numeric:tabular-nums}
.check{display:flex;gap:10px;align-items:flex-start;padding:6px 0;cursor:pointer}
.check input{margin-top:3px;accent-color:var(--accent);width:16px;height:16px;flex:none}
.check.done span{color:var(--faint);text-decoration:line-through}
.pri-in{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.pri-in b{color:var(--accent);width:16px}
.pri-in input{flex:1}
.banner{background:var(--ink);color:var(--surface);border-radius:var(--r);padding:20px 22px;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:16px}
.banner p{margin:4px 0 0;opacity:.8}
.banner .btn{border-color:transparent}
.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px;min-height:200px}
.col.over{border-color:var(--accent);background:var(--accent-soft)}
.col-h{display:flex;justify-content:space-between;font-weight:700;font-size:12.5px;margin:2px 4px 10px}
.kc{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;cursor:grab;box-shadow:var(--shadow)}
.kc .t{font-weight:700;font-size:13px}
.kc .s{font-size:12px;color:var(--muted);margin-top:2px}
.kc .f{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.kc.dragging{opacity:.4}
.grp{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--surface);margin-bottom:10px}
.grp-h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.grp .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.modal{position:fixed;inset:0;background:rgba(20,16,24,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:50;overflow-y:auto}
.modal[hidden]{display:none}
.sheet{background:var(--surface);border-radius:18px;width:100%;max-width:720px;box-shadow:0 20px 60px rgba(0,0,0,.25);border:1px solid var(--line)}
.sheet.wide{max-width:980px}
.sheet-h{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid var(--line)}
.sheet-b{padding:20px 22px}
.sheet-f{display:flex;justify-content:space-between;gap:10px;padding:14px 22px;border-top:1px solid var(--line);background:var(--surface-2);border-radius:0 0 18px 18px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.form .f{display:flex;flex-direction:column;gap:5px;min-width:0}
.form .f.wide{grid-column:1/-1}
.form label{font-size:12px;font-weight:700;color:var(--muted)}
.form .sec{grid-column:1/-1;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent-2);font-weight:800;margin-top:8px;border-top:1px solid var(--line);padding-top:12px}
.form .sec:first-child{margin-top:0;border-top:0;padding-top:0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.stat{background:var(--surface-2);border-radius:10px;padding:10px 12px}
.stat .v{font-weight:800;font-size:18px;font-variant-numeric:tabular-nums}
.stat .l{font-size:11.5px;color:var(--muted);font-weight:600}
.jdgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.jdc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;cursor:pointer;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px}
.jdc:hover{border-color:var(--line-2)}
.jdc .t{font-weight:800;font-size:15px}.jdc .s{font-size:12px;color:var(--muted)}
.jdc .d{font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}
.jdc .f{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.jdtxt{white-space:pre-line}
details.more{padding:0}
details.more summary{cursor:pointer;padding:14px 18px;font-weight:700;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.more summary::-webkit-details-marker{display:none}
details.more summary::after{content:'＋';color:var(--muted)}
details.more[open] summary::after{content:'－'}
details.more .inner{padding:0 18px 18px;display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
@media (max-width:1100px){details.more .inner{grid-template-columns:1fr}}
pre.code{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:14px;overflow:auto;max-height:320px;font:12px/1.5 ui-monospace,Menlo,Consolas,monospace}
ol.steps{padding-left:20px;margin:6px 0 12px} ol.steps li{margin:5px 0}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;font-weight:600;opacity:0;transition:.25s;pointer-events:none;z-index:60;max-width:calc(100% - 32px)}
#toast.show{opacity:1;transform:translateX(-50%)}
.wa{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:8px;background:var(--green-soft);color:var(--green);text-decoration:none;font-weight:800;font-size:12px;flex:none}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.note-pill{display:inline-block;max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom}
.mnav{display:none}
@media (max-width:1100px){.g2,.g2e{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .nav{display:none}
  .mnav{display:flex;position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);overflow-x:auto;gap:4px;padding:8px 12px}
  .mnav a{padding:7px 11px;border-radius:9px;text-decoration:none;color:var(--muted);font-weight:600;white-space:nowrap;font-size:13px}
  .mnav a.on{background:var(--accent-soft);color:var(--accent-2)}
  main{padding:18px 16px 50px}
  h1{font-size:22px}
  .form{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(2,1fr)}
  .modal{padding:0}
  .sheet{border-radius:0;min-height:100vh}
  .stagebar{grid-template-columns:100px 1fr 28px}
}
</style>
</head>
<body>
<nav class="mnav" id="mnav"></nav>
<div class="app">
  <aside class="nav" id="nav"></aside>
  <main id="view"></main>
</div>
<div class="modal" id="modal" hidden></div>
<div id="toast"></div>
<input type="file" id="fileTracker" accept=".xlsx,.xlsm,.xls" hidden>
<input type="file" id="fileDani" accept=".xlsx,.xlsm,.xls,.csv" hidden>
<input type="file" id="fileBackup" accept=".json" hidden>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
/* ============ utilidades ============ */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>iso(new Date());
const parseISO=s=>{const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(s||''));return m?new Date(+m[1],m[2]-1,+m[3]):null};
const daysSince=s=>{const d=parseISO(s);return d?Math.round((parseISO(today())-d)/864e5):null};
const addBiz=n=>{const d=new Date();let k=0;while(k<n){d.setDate(d.getDate()+1);if(d.getDay()%6)k++}return iso(d)};
const fmtD=s=>{const d=parseISO(s);return d?d.toLocaleDateString('es-CO',{day:'numeric',month:'short'}):(s||'')};
const num=v=>{if(typeof v==='number')return v;const n=parseFloat(String(v??'').replace(/,/g,'.').replace(/[^\d.\-]/g,''));return isNaN(n)?0:n};
const norm=s=>String(s??'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();
const codeOf=s=>{const m=/(?:JPC\s*-?\s*)?(\d{3,5})/i.exec(String(s||''));return m?'JPC - '+m[1]:''};
const title=s=>String(s||'').toLowerCase().replace(/(^|\s|\/|-)\S/g,c=>c.toUpperCase());
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2600)}

/* ============ modelo ============ */
const STAGES=['Contactado','Entrevista TA','Video','Prueba','Submittal enviado','Entrevista HM','Oferta','Contratado','Descartado','No responde','Retirado'];
const INACTIVE=['Contratado','Descartado','No responde','Retirado'];
const isActive=c=>c.candidato&&!INACTIVE.includes(c.stage);
const KEY='mariHubTA.v1';
const DEFAULT=()=>({
  v:1,savedAt:0,
  settings:{name:'SOLORZANO PARDO',rules:{old:60,minPer:3,grace:7},sheetsUrl:'',firma:'Mari',empresa:'Solvo Global',applyLink:'',bookingLink:''},
  prioridades:['','',''],
  rutina:{date:'',done:{}},
  data:{headers:[],rows:[],loadedAt:''},
  notasVac:{},
  candidatos:[],search:[],entrevistas:[],tareas:[],jds:[],
  equipo:[1,2,3,4,5].map(()=>({id:uid(),apodo:'',nombreData:'',notas:''})),
  skills:[],estrategias:[]
});
function withDefaults(o){const d=DEFAULT();o=o||{};for(const k in d){if(o[k]==null)o[k]=d[k]}
  o.settings=Object.assign(d.settings,o.settings||{});o.settings.rules=Object.assign({old:60,minPer:3,grace:7},o.settings.rules||{});
  ['old','minPer','grace'].forEach(k=>o.settings.rules[k]=num(o.settings.rules[k]));
  if(!Array.isArray(o.prioridades))o.prioridades=['','',''];
  o.savedAt=num(o.savedAt);return o}
function load(){try{return withDefaults(JSON.parse(localStorage.getItem(KEY)))}catch(e){return DEFAULT()}}
let S=load();
function save(silent){S.savedAt=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}queuePush();if(!silent)renderNav()}

/* ============ esquemas de formularios ============ */
const SCHEMA={
  candidatos:{name:'candidato',fields:[
    {k:'candidato',l:'Candidato',req:1},{k:'vacante',l:'Vacante',t:'vacante'},
    {k:'telefono',l:'Teléfono / WhatsApp',t:'tel'},{k:'email',l:'Email',t:'email'},
    {k:'fuente',l:'Fuente',t:'list',o:['Search','Vendor','Referido','LinkedIn','Computrabajo','Banco de talento','Formulario','Feria virtual']},

let _vc=null,_vcKey='';
function allVacs(){
  const d=S.data;if(!d||!d.headers||!d.headers.length)return[];
  const key=S.savedAt+'|'+d.loadedAt+'|'+d.rows.length+'|'+JSON.stringify(S.settings);
  if(_vc&&_vcKey===key)return _vc;
  const H={};d.headers.forEach((h,i)=>{const k=String(h||'').trim().toLowerCase();if(!(k in H))H[k]=i});
  const g=(r,k)=>{const i=H[k];return i==null?'':r[i]};
  const rec=['recruiter_1','recruiter_2','recruiter_3','recruiter_4','recruiter_5','recruiter_6'];
  const me=S.settings.name.trim().toUpperCase();
  _vc=d.rows.filter(r=>String(g(r,'job_code')).trim()).map(r=>{
    const recs=rec.map(k=>String(g(r,k)||'').trim().toUpperCase());
    const hc=num(g(r,'headcount_requested')),hcPend=num(g(r,'hc_pendiente'));
    const subm=num(g(r,'candidatos_en_submissions')),submAct=num(g(r,'submission_activo')),pipeAct=num(g(r,'pipeline_activo'));
    const v={code:codeOf(g(r,'job_code'))||String(g(r,'job_code')).trim(),pos:String(g(r,'position_name')||'').trim(),client:String(g(r,'client')||'').trim(),
      country:String(g(r,'main_country')||'').trim(),other:String(g(r,'other_countries')||'').trim(),seniority:String(g(r,'category_score_card')||'').trim(),
      open:norm(g(r,'job_status'))==='open',hc,hcPend,hired:Math.max(hc-hcPend,0),subm,submAct,pipeAct,active:submAct+pipeAct,
      aging:num(g(r,'aging')),hm:String(g(r,'hiring_manager')||'').trim(),taPoc:String(g(r,'ta_poc')||'').trim(),recs,
      vertical:String(g(r,'vertical')||'').trim()};
    v.conv=v.subm?v.hired/v.subm:null;
    v.mine=!!me&&v.open&&recs.some(x=>x&&x.includes(me));
    v.isPoc=!!me&&recs[0].includes(me);
    v.label=v.code+' · '+title(v.pos);
    Object.assign(v,evalVac(v));
    return v});
  _vcKey=key;return _vc}
function evalVac(v){
  const R=S.settings.rules,need=Math.ceil(R.minPer*Math.max(v.hcPend,0));let lvl,motivo;
  if(v.hcPend<=0){lvl=1;motivo='HC completo'}
  else if((v.active===0&&v.aging>=R.grace)||(v.aging>=R.old&&v.active<need)){lvl=3;motivo=v.active===0?'Sin candidatos activos':'Vieja y con pocos candidatos'}
  else if(v.active<need||v.aging>=R.old){lvl=2;motivo=v.active<need?(v.active===0?'Recién abierta, aún sin candidatos':'Pocos candidatos para el HC'):`Más de ${R.old} días abierta`}
  else{lvl=1;motivo='Buen ritmo'}
  let score=0;
  if(v.hcPend>0){const gap=need?Math.max(0,need-v.active)/need:0,ag=Math.min(v.aging/R.old,1.5)/1.5,size=Math.min(v.hcPend,10)/10;
    score=Math.round(40*gap+30*ag+20*size+(v.isPoc?10:0))}
  let accion;
  if(v.hcPend<=0)accion='HC completo: nada urgente aquí';
  else if(v.active===0)accion='Sourcing urgente: arranca búsqueda hoy';
  else if(v.active<need)accion=`Consigue ${need-v.active} candidato${need-v.active>1?'s':''} más (meta: ${need} activos)`;
  else if(v.subm>=5&&v.conv!=null&&v.conv<.1)accion=`Pide feedback al HM: conversión de ${Math.round(v.conv*100)}%`;
  else if(v.aging>=R.old)accion='Revisa con el HM qué está frenando el cierre';
  else accion='Buen ritmo: mantén seguimiento a tus candidatos';
  return{lvl,motivo,score,accion,need}}
function myVacs(){return allVacs().filter(v=>v.mine)}
function vacOptions(){const m=myVacs();return m.length?m:allVacs().filter(v=>v.open)}
function myActiveFor(code){return S.candidatos.filter(c=>isActive(c)&&codeOf(c.vacante)===code).length}
function ranked(list){return list.slice().sort((a,b)=>b.score-a.score||b.lvl-a.lvl||b.aging-a.aging)}
const LVL={3:['red','Crítica'],2:['yellow','Atenta'],1:['','Bien']};
const semChip=v=>`<span class="chip ${LVL[v.lvl][0]}"><span class="dot l${v.lvl}"></span>${LVL[v.lvl][1]}</span>`;
function profileKey(pos){return norm(pos).toUpperCase().replace(/[^A-Z0-9 ]/g,' ').replace(/\b(JR|SR|JUNIOR|SENIOR|MID|I|II|III)\b/g,' ').replace(/\s+/g,' ').trim()}

let CEIPAL_LAST=null;
function parseCeipal(txt){
  const L=String(txt||'').replace(/\r/g,'').split('\n').map(x=>x.trim());
  const NA=v=>!v||/^(n\/?a|select|none|-)$/i.test(v);
  const nl=x=>norm(x).replace(/\*\s*$/,'').trim();
  const val=label=>{const i=L.findIndex(x=>nl(x)===norm(label));if(i<0)return'';for(let k=i+1;k<Math.min(i+3,L.length);k++){if(L[k])return NA(L[k])?'':L[k]}return''};
  const startsVal=pref=>{const i=L.findIndex(x=>norm(x).startsWith(norm(pref)));if(i<0)return'';for(let k=i+1;k<Math.min(i+3,L.length);k++){if(L[k])return NA(L[k])?'':L[k]}return''};
  const o={};
  const head=L.find(x=>/JPC\s*-?\s*\d+/i.test(x))||'';const m=/(JPC\s*-?\s*\d+)\s*-\s*(.+)/i.exec(head);
  if(m){o.codigos=codeOf(m[1]);o.titulo=title(m[2].trim())}
  if(!o.codigos){const c=val('Job Code');if(c)o.codigos=codeOf(c)}
  {const t=val('Position Name');if(t)o.titulo=title(t)}
  if(!o.titulo){const t=val('Job Title');if(t)o.titulo=title(t)}
  let other=val('Other Countries');if(/selected$/i.test(other))other='';const mainC=startsVal('Search Within Selected Locations')||(val('Main Country')!=='Other Countries'?val('Main Country'):'');
  o.pais=other||mainC||'';
  o.horario=startsVal('Shift');{const h=val('Required Hours/Week'),ct=val('Contract type');const ex=[ct,h&&h+' h/semana'].filter(Boolean).join(', ');if(ex)o.horario=(o.horario?o.horario+' · ':'')+ex}
  const lvl=startsVal('Level ( per each language')||startsVal('Level (per each language');if(lvl)o.ingles=lvl.replace(/\s*\(.*\)\s*/,'').trim()+(/\((.*)\)/.exec(lvl)?' ('+/\((.*)\)/.exec(lvl)[1]+')':'');
  o.salario=val('Recommended Salary');
  o.seniority=val('Category (ScoreCard)');
  o.cliente=val('VMS Client Name')||'';
  const req=[];const exp=val('Time of Experience');if(exp)req.push('Experiencia: '+exp);
  const acad=startsVal('Academic degrees');if(acad)req.push('Formación / herramientas: '+acad);
  if(o.ingles)req.push('Inglés '+o.ingles);
  const crit=L.findIndex(x=>norm(x)==='search criteria');
  const skl=L.find(x=>/\s{2}x\S/.test(x)||/\s{2}x$/.test(x));
  if(crit<0&&skl){const sk=skl.split(/\s+x(?=\S|$)/).map(x=>x.trim()).filter(Boolean);if(sk.length)req.push('Competencias: '+sk.map(x=>(x.charAt(0).toUpperCase()+x.slice(1).toLowerCase()).replace(/\b(kpi|sla|qa)\b/gi,w=>w.toUpperCase())).join(', '))}
  if(crit>=0){const q=L[crit+1]||'';const sk=[...q.matchAll(/\(\s*"?\s*([^()"]+?)\s*"?\s*\)/g)].map(x=>x[1].trim()).filter(Boolean);
    if(sk.length)req.push('Competencias: '+sk.map(x=>(x.charAt(0)+x.slice(1).toLowerCase()).replace(/\b(kpi|sla|qa)\b/gi,w=>w.toUpperCase())).join(', '))}
  o.requisitos=req.map(x=>'- '+x).join('\n');
  const fil=[];const vid=startsVal('Applicant video required');if(vid)fil.push('Video del candidato: '+vid);
  const visa=startsVal('U.S. visa or passport');if(visa)fil.push('Visa / pasaporte EE. UU.: '+visa);
  o.filtros=fil.map(x=>'- '+x).join('\n');
  const notas=[];[['Hiring Manager','Hiring manager'],['Headcount requested','HC solicitado'],['Is this a replacement?','¿Es reemplazo?'],['The position reports to what position?','Reporta a'],['Industries','Industria'],['Account SubDepartment','Sub-departamento'],['Profile Observation or comments','Observaciones del perfil'],['What is your estimated or projected start date to begin training your Solvo hires?','Inicio de training'],['Career Portal Published Date','Publicado en career portal']].forEach(([k,l])=>{const v=val(k);if(v)notas.push(l+': '+v)});
  o.notas=notas.join('\n');
  // ---- descripción del cargo ----
  const STOP=/^(add public job details|job details|search criteria|notes|documents( add)?|submissions|skills|attachments|client type|headcount requested|organizational information.*|responsible team|string builder|location details|filters|generate string with copilot|showing .*entries.*)$/i;
  const DESC=/^(public\s+)?(job\s+)?(description|descripci[oó]n)(\s+(del|de la)\s+(cargo|puesto|rol|vacante|posici[oó]n))?\s*:?$|^(job|position|role)\s+(summary|overview)\s*:?$|^(summary|overview|about (the|this) (role|job|position))\s*:?$|^resumen( del (rol|cargo|puesto))?\s*:?$/i;
  let block=[];const di=L.findIndex(x=>DESC.test(x));
  if(di>=0){for(let k=di+1;k<L.length;k++){if(STOP.test(L[k]))break;block.push(L[k])}}
  else{ // sin título: tomar los párrafos largos (prosa) del texto
    const isProse=x=>x.length>=70&&x.split(/\s+/).length>=10&&!/[?@]/.test(x)&&!/^\(/.test(x);
    const a0=L.findIndex(isProse);
    if(a0>=0){for(let k=a0;k<L.length;k++){if(STOP.test(L[k]))break;block.push(L[k])}}}
  if(block.join('').trim()){
    const SUB=[['responsabilidades',/^(key\s+)?(responsibilit(y|ies)|duties|main duties|what you('|’)?ll do|what you will do|key (tasks|activities|functions)|funciones|responsabilidades|actividades|tus funciones)/i],
               ['requisitos',/^(requirements?|qualifications?|what we('|’)?re looking for|what we are looking for|must[- ]haves?|you have|skills( required)?|requisitos|perfil|lo que buscamos|nice to have)/i],
               ['beneficios',/^(benefits?|perks|what we offer|we offer|beneficios|ofrecemos|lo que ofrecemos|compensation)/i]];
    const parts={resumen:[],responsabilidades:[],requisitos:[],beneficios:[]};let cur='resumen';
    block.forEach(x=>{const h=x.length<70&&SUB.find(([,re])=>re.test(x.replace(/^[^\w¿¡]+/,'')));if(h){cur=h[0];const rest=x.replace(/^[^:]*:\s*/,'');if(rest&&rest!==x&&rest.length>3)parts[cur].push(rest);return}parts[cur].push(x)});
    const clean=arr=>arr.join('\n').replace(/\n{3,}/g,'\n\n').trim();
    if(clean(parts.resumen))o.resumen=clean(parts.resumen);
    if(clean(parts.responsabilidades))o.responsabilidades=clean(parts.responsabilidades);
    if(clean(parts.beneficios))o.beneficios=clean(parts.beneficios);
    if(clean(parts.requisitos))o.requisitos=clean(parts.requisitos)+(o.requisitos?'\n'+o.requisitos:'')}
  if(!o.resumen&&o.titulo){const ind=(val('Industries')||'').replace(/^[A-Z]-[A-Z]+\s*\(?|\)$/g,'').trim();
    o.resumen=`Buscamos ${o.seniority?'un/a '+o.titulo+' ('+o.seniority+')':'un/a '+o.titulo}${ind?' para una cuenta del sector '+ind:''}${o.pais?', para '+o.pais:''}.`+(o.horario?` Horario: ${o.horario}.`:'')+(o.ingles?` Inglés ${o.ingles}.`:'')+(exp?` Experiencia requerida: ${exp}.`:'');o._resumenAuto=1}
  Object.keys(o).forEach(k=>{if(!o[k])delete o[k]});
  return o}

function htmlToText(h){h=String(h).replace(/<(style|script|head)[\s\S]*?<\/\1>/gi,'').replace(/<br\s*\/?>|<\/(p|div|tr|li|h\d)>/gi,'\n').replace(/<\/td>/gi,' | ').replace(/<[^>]+>/g,'');
  const t=document.createElement('textarea');t.innerHTML=h;return t.value.replace(/[ \t ]+/g,' ').replace(/\n\s*\n+/g,'\n').trim()}
function msgToText(buf){
  if(typeof XLSX==='undefined'||!XLSX.CFB)throw new Error('lector');
  const c=XLSX.CFB.read(new Uint8Array(buf),{type:'array'});
  const get=n=>{const i=c.FullPaths.findIndex(p=>p.replace(/^Root Entry\//,'')===n);return i>=0?c.FileIndex[i].content:null};
  const subj=get('__substg1.0_0037001F');const S0=subj?new TextDecoder('utf-16le').decode(new Uint8Array(subj)):'';
  let h=get('__substg1.0_10130102');
  if(h){h=new Uint8Array(h);const head=new TextDecoder('latin1').decode(h.slice(0,3000));const m=/charset=["']?([\w-]+)/i.exec(head);let enc=(m&&m[1]||'utf-8').toLowerCase();
    let t;try{t=new TextDecoder(enc).decode(h)}catch(e){t=new TextDecoder('utf-8').decode(h)}return S0+'\n'+htmlToText(t)}
  const b=get('__substg1.0_1000001F');if(b)return S0+'\n'+new TextDecoder('utf-16le').decode(new Uint8Array(b));
  throw new Error('vacío')}
function emlToText(t){let body=t;const i=t.search(/\r?\n\r?\n/);if(i>0)body=t.slice(i);
  if(/quoted-printable/i.test(t))body=body.replace(/=\r?\n/g,'').replace(/=([0-9A-F]{2})/gi,(m,h)=>String.fromCharCode(parseInt(h,16)));
  try{body=decodeURIComponent(escape(body))}catch(e){}
  return /<html|<div|<p[\s>]/i.test(body)?htmlToText(body):body}
const F001K=["Client Code","Client Name","Position Title","Industry","Department","SubDepartment","Account's line of work","Number of Positions","Country","City","Location","Position type","Is this position required to fill a position of an employee in PTL?","CDP","SOLID","This position will be recruited from the recruiter or Schedule's schools?","Staff Position","Approved by","Staff department","Experience Level","Shift days, hours and time zone","English required","Level of study required","Hiring manager name","Hiring manager email","Hiring manager number","First BC","Second BC","OPS Director","Desired start date","Job description","Responsabilities","Responsibilities","Skills and qualifications - Hard and soft skills","Vensure and divisional partner?","Who is requesting the vacancy?","Who approves the vacancy?","Vacancy could be recruited from another city","Workday","Weekly hours of work","Comments and notes","Salary","Salary range","Benefits"];
const MULTI=new Set(["Country","Job description","Responsabilities","Responsibilities","Skills and qualifications - Hard and soft skills","Comments and notes","Benefits"]);
const isF001=t=>/Request Contents|Position Title\s*:|New F001/i.test(t);
function parseF001(txt){
  let T=String(txt).replace(/\r/g,'');const rc=T.search(/Request Contents/i);const sec=rc>=0?T.slice(rc):T;
  const esc2=x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  const hits=[];F001K.forEach(k=>{const re=new RegExp('(^|\\n)[ \\t]*'+esc2(k)+'[ \\t]*:','gi');let m;while((m=re.exec(sec))){hits.push({k,start:m.index+m[1].length,vs:m.index+m[0].length});break}});
  hits.sort((a,b)=>a.start-b.start);
  const F={};hits.forEach((h,i)=>{let v=sec.slice(h.vs,i+1<hits.length?hits[i+1].start:undefined);
    v=v.split(/\n(?:From|De|Regards|Saludos|Best regards)\s*:?/i)[0];
    if(!MULTI.has(h.k)){const lines=v.split('\n');v=lines[0].trim()?lines[0]:(lines[1]||'')}
    F[h.k]=v.replace(/\s*\n\s*/g,' ').replace(/\s{2,}/g,' ').trim()});
  const NA=v=>!v||/^(none|n\/?a|null|-|\[\])$/i.test(v);const g=k=>NA(F[k])?'':F[k];
  const sent=t=>String(t||'').split(/(?<=[.!?])\s+(?=[A-ZÁÉÍÓÚÑ¿¡])/).map(x=>x.trim()).filter(Boolean);
  const o={};
  const req=/REQ ID\s*:\s*(JPC\s*-?\s*\d+)/i.exec(T)||/(JPC\s*-\s*\d{3,5})/i.exec(T);if(req)o.codigos=codeOf(req[1]);
  const v=o.codigos&&allVacs().find(x=>x.code===o.codigos);
  o.titulo=v?title(v.pos):title(g('Position Title'));
  const ind=g('Industry').replace(/^[A-Z]-[A-Z]+\s*\(?|\)$/g,'').trim();
  o.cliente=[g('Client Name'),ind].filter(Boolean).join(' · ');
  // países
  let cs=[];try{cs=JSON.parse(g('Country')||'[]')}catch(e){cs=g('Country').split(/[,;]/)}
  const byC={};cs.map(x=>String(x).trim()).filter(Boolean).forEach(x=>{const [c,ci]=x.split(/\s+-\s+/);(byC[c]=byC[c]||[]);if(ci)byC[c].push(ci)});
  o.pais=Object.entries(byC).map(([c,ci])=>ci.length?`${c} (${ci.join(', ')})`:c).join(' · ')||(v&&v.country)||'';
  o.horario=[g('Shift days, hours and time zone'),g('Workday'),g('Weekly hours of work')].filter((x,i,a)=>x&&a.indexOf(x)===i).join(' · ');
  o.ingles=g('English required');o.salario=g('Salary')||g('Salary range');
  const exp=g('Experience Level');o.seniority=exp.replace(/\s*\(.*\)/,'').trim();
  // descripción
  o.resumen=g('Job description');
  let R0=g('Responsabilities')||g('Responsibilities');let quals='',attrs='';
  const qi=R0.search(/\bQualifications\s*:/i);const ai=R0.search(/\bAttributes\s*:/i);
  if(ai>=0){attrs=R0.slice(ai).replace(/^Attributes\s*:\s*/i,'');R0=R0.slice(0,ai)}
  if(qi>=0&&(ai<0||qi<ai)){quals=R0.slice(qi).replace(/^Qualifications\s*:\s*/i,'');R0=R0.slice(0,qi)}
  R0=R0.replace(/^\s*Key Responsibilities\s*:\s*/i,'').trim();
  if(R0){const topics=R0.split(/(?<=[.!?])\s+(?=[A-Z][A-Za-z&\/]+(?:\s+[A-Za-z&\/]+){0,4}:\s)/);
    o.responsabilidades=topics.map(t=>{const m=/^([A-Z][^:]{1,45}):\s*(.*)$/.exec(t);return m?m[1]+'\n'+sent(m[2]).map(x=>'- '+x).join('\n'):sent(t).map(x=>'- '+x).join('\n')}).join('\n\n')}
  const at=sent(attrs);const tail=at.filter(x=>/^A successful/i.test(x));
  if(tail.length)o.resumen=(o.resumen?o.resumen+'\n\n':'')+tail.join(' ');
  const reqs=[...sent(quals).map(x=>'- '+x)];
  if(exp)reqs.push('- Experiencia: '+exp);if(o.ingles)reqs.push('- Inglés: '+o.ingles);if(g('Level of study required'))reqs.push('- Estudios: '+g('Level of study required'));
  const sk=g('Skills and qualifications - Hard and soft skills').split('•').map(x=>x.trim()).filter(Boolean);
  let rq=reqs.join('\n');
  if(sk.length)rq+=(rq?'\n\n':'')+'Habilidades:\n'+sk.map(x=>'- '+x).join('\n');
  const atr=at.filter(x=>!/^A successful/i.test(x));if(atr.length)rq+=(rq?'\n\n':'')+'Atributos:\n'+atr.map(x=>'- '+x).join('\n');
  o.requisitos=rq;o.beneficios=g('Benefits');
  const N=[];[['Hiring manager name','Hiring manager'],['Hiring manager email','Email HM'],['OPS Director','OPS Director'],['Who is requesting the vacancy?','Solicitado por'],['Number of Positions','Posiciones'],['Position type','Tipo'],['Desired start date','Fecha de inicio deseada'],['Vacancy could be recruited from another city','Se puede reclutar desde otra ciudad'],['Comments and notes','Comentarios']].forEach(([k,l])=>{if(g(k))N.push(l+': '+g(k))});
  o.notas=N.join('\n');
  Object.keys(o).forEach(k=>{if(!o[k])delete o[k]});return o}

   <p class="small muted">${ex?'Ya tienes un JD para este código: solo voy a llenar los campos que estén vacíos.':'En el siguiente paso puedes revisar y completar (responsabilidades, salario, beneficios) antes de guardar.'}</p>`;
  const f=$('#modal .sheet-f');f.innerHTML=`<button class="btn" data-act="ceipalRead">Volver a leer</button><button class="btn pri" data-act="ceipalUse">${ex?'Completar JD':'Crear JD con estos datos'}</button>`}

const tag=s=>'#'+norm(s).replace(/[^a-z0-9]+(.)?/g,(m,c)=>c?c.toUpperCase():'').replace(/^./,c=>c.toUpperCase());

function contactModal(){

    <label class="check" style="margin-top:8px"><input type="checkbox" id="ctReg" ${CQ.reg?'checked':''}><span>Registrar el contacto: último contacto hoy, próximo seguimiento en 2 días hábiles y una línea en sus notas</span></label>
   </div>
   <div class="sheet-f"><div style="display:flex;gap:8px">${bulk?`<button class="btn" data-act="ctNav" data-d="-1" ${CQ.i===0?'disabled':''}>←</button><button class="btn" data-act="ctNav" data-d="1" ${CQ.i===CQ.ids.length-1?'disabled':''}>Saltar →</button>`:''}</div>

function contactSend(how){
  const c=S.candidatos.find(x=>x.id===CQ.ids[CQ.i]);const body=$('#ctBody').value;const subj=$('#ctSubj')?$('#ctSubj').value:'';
  const key=CQ.tpl||tplFor(c);const tl=(TPL.find(t=>t[0]===key)||[])[1]||'';
  if(how==='wa'){const tel=phoneDigits(c.telefono);window.open(`https://wa.me/${tel}?text=${encodeURIComponent(body)}`,'_blank','noopener')}
  else if(how==='mail'){location.href=`mailto:${encodeURIComponent(c.email||'')}?subject=${encodeURIComponent(subj)}&body=${encodeURIComponent(body)}`}
  else navigator.clipboard.writeText(body).then(()=>toast('Mensaje copiado'),()=>{$('#ctBody').select();toast('Selecciona y copia con Ctrl+C')});
  if(CQ.reg){c.ultimoContacto=today();c.proximoSeg=addBiz(2);c.notas=`${fmtD(today())} · ${how==='mail'?'Correo':how==='wa'?'WhatsApp':'Mensaje copiado'} · ${tl}`+(c.notas?'\n'+c.notas:'');save(true)}
  CQ.sent=(CQ.sent||0)+1;
  if(CQ.ids.length>1&&CQ.i<CQ.ids.length-1){CQ.i++;setTimeout(contactModal,how==='copy'?600:250)}

function teamStats(m){
  const name=String(m.nombreData||'').trim().toUpperCase();if(!name)return null;
  const vs=allVacs().filter(v=>v.open&&v.recs.some(r=>r&&r.includes(name)));
  if(!vs.length)return{vs,n:0};
  const s=k=>vs.reduce((a,v)=>a+v[k],0);
  const red=vs.filter(v=>v.lvl===3).length,yel=vs.filter(v=>v.lvl===2).length;
  return{vs,n:vs.length,hcPend:s('hcPend'),hired:s('hired'),submAct:s('submAct'),pipeAct:s('pipeAct'),agAvg:Math.round(s('aging')/vs.length),agMax:Math.max(...vs.map(v=>v.aging)),red,yel,
    ayuda:red?['red','Necesita apoyo ya']:yel?['yellow','Acompañar']:['green','Va bien']}}
VIEWS.equipo=()=>{
  const eq=S.equipo.filter(m=>m.apodo||m.nombreData);
  const who=UI.teamWho;const pick=who==='all'?eq:eq.filter(m=>m.id===who);
  const tv={};pick.forEach(m=>{const st=teamStats(m);(st&&st.vs||[]).forEach(v=>{(tv[v.code]=tv[v.code]||{v,who:[]}).who.push(m.apodo||m.nombreData)})});
  const tvl=Object.values(tv).sort((a,b)=>b.v.lvl-a.v.lvl||b.v.aging-a.v.aging);

/* ============ modal y formularios ============ */
function openModal(html){const m=$('#modal');m.innerHTML=html;m.hidden=false;document.body.style.overflow='hidden';const f=$('input,textarea,select',m);f&&f.focus&&setTimeout(()=>f.focus(),30)}
function closeModal(){const m=$('#modal');m.hidden=true;m.innerHTML='';document.body.style.overflow=''}
$('#modal').addEventListener('mousedown',e=>{if(e.target.id==='modal')closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').hidden)closeModal()});
function fieldHTML(f,val){
  const id='f_'+f.k;let opts=typeof f.o==='function'?f.o():f.o||[];
  let inp;
  if(f.t==='area')inp=`<textarea class="in" id="${id}" rows="3">${esc(val)}</textarea>`;
  else if(f.t==='select'){if(val&&!opts.includes(val))opts=[val,...opts];inp=`<select class="in" id="${id}">${opts.map(o=>`<option value="${esc(o)}" ${o===(val||'')?'selected':''}>${esc(o||'—')}</option>`).join('')}</select>`}
  else if(f.t==='person'){const ps=S.equipo.map(m=>m.apodo||m.nombreData).filter(Boolean).concat(['Mari']);if(val&&!ps.includes(val))ps.unshift(val);inp=`<select class="in" id="${id}"><option value=""></option>${ps.map(o=>`<option ${o===val?'selected':''}>${esc(o)}</option>`).join('')}</select>`}
  else{const typ={date:'date',time:'time',email:'email',tel:'tel',url:'url'}[f.t]||'text';
    if(f.t==='vacante')opts=vacOptions().map(v=>v.label);
    const dl=(f.t==='list'||f.t==='vacante')?`<datalist id="dl_${f.k}">${[...new Set(opts)].map(o=>`<option value="${esc(o)}">`).join('')}</datalist>`:'';
    inp=`<input class="in" id="${id}" type="${typ}" value="${esc(val)}" ${dl?`list="dl_${f.k}"`:''}>${dl}`}
  return`<div class="f ${f.wide?'wide':''}"><label for="${id}">${esc(f.l)}${f.req?' *':''}</label>${inp}</div>`}
let editing=null;
let PREFILL=null;
function openForm(coll,id,preset,pos){
  const sc=SCHEMA[coll];const item=id?S[coll].find(x=>x.id===id):null;const it=item?Object.assign({},item):{};
  if(PREFILL){for(const k in PREFILL){if(PREFILL[k]&&!it[k])it[k]=PREFILL[k]}PREFILL=null}
  if(!item){if(coll==='candidatos'){it.stage='Contactado';it.fechaStage=today();it.proximoSeg=addBiz(2);if(preset)it.vacante=preset}
    if(coll==='tareas'){it.cuando='Hoy';it.estado='Pendiente'}
    if(coll==='entrevistas'){it.fecha=today();it.entrevistador='Mari'}
    if(coll==='jds'){if(preset)it.codigos=preset;if(pos)it.titulo=pos;const v=preset&&allVacs().find(x=>x.code===preset);if(v){it.pais=v.country;it.seniority=v.seniority;it.cliente=v.client.replace(/^C-\d+\s*-\s*/,'')}}
    if(coll==='estrategias'){it.fechaInicio=today();it.estado='Por iniciar';it.responsable='Mari';if(preset)it.jobCode=preset}}
  editing={coll,id};
  openModal(`<div class="sheet ${sc.wide?'wide':''}"><div class="sheet-h"><h2>${item?'Editar':'Nuevo/a'} ${sc.name}</h2><button class="btn ghost" data-act="close">✕</button></div>
   <div class="sheet-b"><div class="form">${sc.fields.map(f=>f.sec?`<div class="sec">${esc(f.sec)}</div>`:fieldHTML(f,it[f.k]??'')).join('')}</div>${coll==='candidatos'&&item?candEntrevistas(item):''}</div>
   <div class="sheet-f">${item?`<button class="btn danger" data-act="del">Eliminar</button>`:'<span></span>'}<div style="display:flex;gap:8px">${coll==='candidatos'&&item?`<button class="btn" data-act="toEntrevista">+ Entrevista</button><button class="btn" data-act="contactFromForm">💬 Contactar</button>`:''}<button class="btn" data-act="close">Cancelar</button><button class="btn pri" data-act="saveForm">Guardar</button></div></div></div>`)}
function candEntrevistas(c){const L=S.entrevistas.filter(e=>norm(e.nombre)===norm(c.candidato));
  return`<h3 style="margin-top:18px">Entrevistas (${L.length})</h3>${L.length?`<div class="list">${L.map(e=>`<div class="li" data-act="edit" data-c="entrevistas" data-id="${e.id}" style="cursor:pointer"><div class="main"><div class="t">${esc(fmtD(e.fecha))} ${esc(e.hora||'')} · ${esc(e.tipo||'Entrevista')}</div><div class="s">${esc(e.observaciones||e.nivelIngles||'')}</div></div>${e.paso?`<span class="chip ${e.paso==='No'?'red':''}">${e.paso==='Sí'?'Pasó':e.paso==='No'?'No pasó':'En duda'}</span>`:''}</div>`).join('')}</div>`:'<div class="small muted">Sin entrevistas. Usa "+ Entrevista" para llenar la ficha.</div>'}`}
function saveForm(){
  const {coll,id}=editing;const sc=SCHEMA[coll];const o={};
  sc.fields.forEach(f=>{if(f.k){const el=$('#f_'+f.k);if(el)o[f.k]=el.value.trim()}});
  const miss=sc.fields.find(f=>f.req&&!o[f.k]);if(miss){toast('Falta: '+miss.l);$('#f_'+miss.k).focus();return}
  if(id){const it=S[coll].find(x=>x.id===id);
    if(coll==='candidatos'&&it.stage!==o.stage&&o.fechaStage===it.fechaStage)o.fechaStage=today();
    Object.assign(it,o)}else S[coll].unshift(Object.assign({id:uid()},o));
  save();closeModal();render();toast('Guardado')}

document.addEventListener('click',e=>{

    contacted:()=>{const c=S.candidatos.find(x=>x.id===id);c.ultimoContacto=today();c.proximoSeg=addBiz(2);save();render();toast(`${c.candidato}: próximo seguimiento ${fmtD(c.proximoSeg)}`)},

  if(t.dataset.sel){UI[t.dataset.sel]=t.value;render()}
  else if(t.dataset.chk){UI[t.dataset.chk]=t.checked;render()}
  else if(t.dataset.pri!=null){S.prioridades[+t.dataset.pri]=t.value.trim();save(true)}
  else if(t.dataset.rut){S.rutina.done[t.dataset.rut]=t.checked;t.closest('.check').classList.toggle('done',t.checked);save(true)}
  else if(t.dataset.done){const x=S.tareas.find(z=>z.id===t.dataset.done);x.estado=t.checked?'Hecha':'Pendiente';save();render()}
  else if(t.dataset['1on1']){const m=S.equipo.find(z=>z.id===t.dataset['1on1']);m.notas=t.value.trim();save(true);toast('Nota del 1:1 guardada')}
});

/* ============ importar Excel ============ */
function serialToISO(n){const d=new Date(Math.round((n-25569)*864e5));return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate())}
function toISO(v){if(v==null||v==='')return'';if(typeof v==='number')return v>20000&&v<80000?serialToISO(v):'';if(v instanceof Date)return iso(v);
  const s=String(v).trim();let m=/^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(s);if(m)return m[1]+'-'+pad(m[2])+'-'+pad(m[3]);
  m=/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/.exec(s);if(m){const y=m[3].length===2?'20'+m[3]:m[3];return y+'-'+pad(m[2])+'-'+pad(m[1])}return s}
function cellStr(v){if(v==null)return'';if(typeof v==='number')return Number.isInteger(v)?String(v):String(+v.toFixed(4));return String(v).trim()}
function readTable(rows,hdrIdx,keys,{time}={}){const out=[];
  for(let i=hdrIdx+1;i<rows.length;i++){const r=rows[i]||[];const o={id:uid()};let any=false;
    keys.forEach((k,j)=>{if(!k)return;let v=r[j];if(DATEK.has(k))v=toISO(v);else if(k==='hora'&&typeof v==='number'&&v<1){const m=Math.round(v*1440);v=pad(Math.floor(m/60))+':'+pad(m%60)}else v=cellStr(v);o[k]=v;if(v)any=true});
    if(any)out.push(o)}return out}
const findRow=(rows,pred)=>rows.findIndex(r=>r&&pred(r.map(c=>norm(c))));
function wsRows(ws){if(!ws||!ws['!ref'])return[];const rg=XLSX.utils.decode_range(ws['!ref']);rg.s.r=0;rg.s.c=0;return XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:'',range:rg,blankrows:true})}
function sheetRows(wb,name){const n=wb.SheetNames.find(s=>norm(s)===norm(name));return n?wsRows(wb.Sheets[n]):null}
async function readWb(file){if(typeof XLSX==='undefined'){toast('No cargó el lector de Excel. Revisa tu conexión.');throw new Error('xlsx')}return XLSX.read(await file.arrayBuffer(),{type:'array'})}
$('#fileTracker').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
  try{const wb=await readWb(f);const N=importTracker(wb);save();render();
    toast(`Importado: ${N.c} candidatos, ${N.s} de search, ${N.t} tareas, ${N.e} entrevistas${N.d?`, ${N.d} vacantes`:''}`)}catch(err){console.error(err);toast('No pude leer ese Excel')}});
function importTracker(wb){
  const N={c:0,s:0,t:0,e:0,d:0};
  if((S.candidatos.length||S.tareas.length)&&!confirm('Esto reemplaza lo que tienes en la página con lo del Excel. ¿Seguimos?'))throw new Error('cancel');
  let r=sheetRows(wb,'Candidatos');if(r){const h=findRow(r,x=>x[0]==='candidato'&&x[1]==='vacante');if(h>=0){S.candidatos=readTable(r,h,XL.candidatos).filter(c=>c.candidato);N.c=S.candidatos.length}}
  r=sheetRows(wb,'Search');if(r){const h=findRow(r,x=>x[1]==='applicant name');if(h>=0){S.search=readTable(r,h,XL.search).filter(s=>s.nombre);N.s=S.search.length}}
  r=sheetRows(wb,'Entrevistas');if(r){const h=findRow(r,x=>x[0]==='nombre candidato');if(h>=0){S.entrevistas=readTable(r,h,XL.entrevistas).filter(x=>x.nombre);N.e=S.entrevistas.length}}
  r=sheetRows(wb,'Tareas');if(r){const h=findRow(r,x=>x[0]==='tarea'&&x[1]==='categoria');if(h>=0){S.tareas=readTable(r,h,XL.tareas).filter(x=>x.tarea);S.tareas.forEach(x=>{if(!x.estado)x.estado='Pendiente'});N.t=S.tareas.length}}
  r=sheetRows(wb,'info vacantes');if(r){
    let h=findRow(r,x=>x[1]==='como le digo');if(h>=0){const eq=[];for(let i=h+1;i<r.length;i++){const x=r[i];if(!/^\d+$/.test(cellStr(x[0])))break;eq.push({id:uid(),apodo:cellStr(x[1]),nombreData:cellStr(x[2]).toUpperCase(),notas:cellStr(x[13])})}if(eq.length)S.equipo=eq}
    const rule=(txt,k)=>{const i=findRow(r,x=>x.some(c=>c.startsWith(txt)));if(i>=0){const n=r[i].find(c=>typeof c==='number');if(n!=null)S.settings.rules[k]=n}};
    rule('una vacante es "vieja"','old');rule('candidatos activos minimos','minPer');rule('dias de gracia','grace');
    h=findRow(r,x=>x[1]==='persona'&&x[2]==='skill a mejorar');if(h>=0){S.skills=[];for(let i=h+1;i<r.length;i++){const x=r[i];if(!/^\d+$/.test(cellStr(x[0])))break;if(cellStr(x[2])||cellStr(x[3]))S.skills.push({id:uid(),persona:cellStr(x[1]),skill:cellStr(x[2]),plan:cellStr(x[3]),fecha:toISO(x[4]),estado:cellStr(x[5]),avance:cellStr(x[6])})}}
    h=findRow(r,x=>x[1]==='job code'&&x[3]==='responsable');if(h>=0){S.estrategias=[];for(let i=h+1;i<r.length;i++){const x=r[i];if(!/^\d+$/.test(cellStr(x[0])))break;if(cellStr(x[1])&&cellStr(x[4]))S.estrategias.push({id:uid(),jobCode:codeOf(x[1])||cellStr(x[1]),responsable:cellStr(x[3]),estrategia:cellStr(x[4]),fechaInicio:toISO(x[5]),estado:cellStr(x[6]),resultado:cellStr(x[7])})}}}
  r=sheetRows(wb,'Inicio');if(r){
    const nm=r[2]&&cellStr(r[2][11]);if(nm)S.settings.name=nm.toUpperCase();
    const p=findRow(r,x=>x[1]==='1.');if(p>=0)S.prioridades=[0,1,2].map(i=>cellStr((r[p+i]||[])[2]));
    r.forEach(row=>row.forEach(c=>{const m=/^\s*(\d{4})\s*-\s*([\s\S]+)/.exec(typeof c==='string'?c:'');if(m){const k='JPC - '+m[1];S.notasVac[k]=S.notasVac[k]&&!S.notasVac[k].includes(m[2].trim())?S.notasVac[k]+'\n'+m[2].trim():m[2].trim()}else if(typeof c==='string'&&/^no me copiaron/i.test(c.trim())){const k='JPC - '+((/(\d{4})/.exec(c)||[])[1]||'');if(k.length>6)S.notasVac[k]=(S.notasVac[k]?S.notasVac[k]+'\n':'')+c.trim()}}))}
  r=sheetRows(wb,'Data');if(r&&r.length>1){N.d=setData(r)}
  return N}
function setData(rows){
  const h=findRow(rows,x=>x.includes('job_code'));if(h<0){toast('No encontré la columna job_code');return 0}
  const headers=rows[h].map(cellStr);const body=rows.slice(h+1).filter(r=>r.some(c=>c!==''&&c!=null)).map(r=>headers.map((_,i)=>{const v=r[i];return typeof v==='number'?v:cellStr(v)}));
  S.data={headers,rows:body,loadedAt:today()+'T'+new Date().toTimeString().slice(0,5)};_vc=null;return body.length}
function loadDataFromText(txt){
  if(!txt.trim()){toast('Pega primero el contenido');return 0}
  const lines=txt.replace(/\r/g,'').split('\n').filter(l=>l.trim());const sep=lines[0].includes('\t')?'\t':(lines[0].split(';').length>lines[0].split(',').length?';':',');
  const rows=lines.map(l=>l.split(sep));const n=setData(rows);if(n)save();return n}
$('#fileDani').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
  try{if(/\.csv$/i.test(f.name)){const n=loadDataFromText(await f.text());if(n){render();toast(`Dashboard cargado: ${n} vacantes`)}return}
    const wb=await readWb(f);let r=sheetRows(wb,'Data');if(!r){const last=wb.SheetNames[wb.SheetNames.length-1];r=wsRows(wb.Sheets[last])}
    const n=setData(r);if(n){save();render();toast(`Dashboard cargado: ${n} vacantes · ${myVacs().length} tuyas`)}}catch(err){console.error(err);toast('No pude leer ese Excel')}});
$('#fileBackup').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
  try{const o=JSON.parse(await f.text());if(!confirm('¿Reemplazar todo con este respaldo?'))return;const url=S.settings.sheetsUrl;S=withDefaults(o);S.settings.sheetsUrl=url||S.settings.sheetsUrl;save();render();toast('Respaldo restaurado')}catch(err){toast('Ese archivo no es un respaldo válido')}});
function pasteDaniModal(){openModal(`<div class="sheet"><div class="sheet-h"><h2>Pegar dashboard de Dani</h2><button class="btn ghost" data-act="close">✕</button></div>

/* ============ Google Sheets ============ */
const syncState={cls:'',txt:'Solo en este navegador',tip:''};
function setSync(k,tip){const M={off:['','Solo en este navegador'],wait:['wait','Cambios por subir…'],saving:['wait','Guardando en Sheets…'],ok:['ok','Guardado en Sheets'],err:['err','Error con Sheets'],load:['wait','Trayendo de Sheets…']};
  k=k||(S.settings.sheetsUrl?'ok':'off');[syncState.cls,syncState.txt]=M[k];syncState.tip=tip||'';
  $$('.sync').forEach(p=>{p.className='sync '+syncState.cls;p.title=syncState.tip;p.lastChild.textContent=syncState.txt})}
let pushT;
function queuePush(){if(!S.settings.sheetsUrl)return;setSync('wait');clearTimeout(pushT);pushT=setTimeout(()=>push(),2500)}
async function push(manual){if(!S.settings.sheetsUrl)return;clearTimeout(pushT);setSync('saving');
  try{const r=await fetch(S.settings.sheetsUrl,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'save',data:S})});
    const j=await r.json();if(!j.ok)throw new Error(j.error||'error');setSync('ok','Último guardado: '+new Date().toLocaleTimeString('es-CO'));if(manual)toast('Subido a Google Sheets')}
  catch(e){console.error(e);setSync('err',String(e.message||e));if(manual)toast('No pude guardar en Sheets: revisa la URL y el acceso "Cualquier persona"')}}
async function pull(manual,force){if(!S.settings.sheetsUrl)return false;setSync('load');
  try{const r=await fetch(S.settings.sheetsUrl+'?action=load&t='+Date.now());const j=await r.json();if(!j.ok)throw new Error(j.error||'error');
    const remote=j.data;
    if(remote&&(force||num(remote.savedAt)>S.savedAt||manual)){const url=S.settings.sheetsUrl;S=withDefaults(remote);S.settings.sheetsUrl=url;_vc=null;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}setSync('ok');render();if(manual)toast('Traído de Google Sheets');return true}
    setSync('ok');if(manual)toast(remote?'Ya estás al día':'Tu Sheet está vacío');return!!remote}
  catch(e){console.error(e);setSync('err',String(e.message||e));if(manual)toast('No pude leer tu Sheet');return false}}
async function connectSheets(){const url=$('#setUrl').value.trim();if(!/^https:\/\/script\.google\.com\/.+\/exec/.test(url)){toast('La URL debe ser de script.google.com y terminar en /exec');return}
  S.settings.sheetsUrl=url;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}setSync('load');
  try{const r=await fetch(url+'?action=load&t='+Date.now());const j=await r.json();if(!j.ok)throw new Error(j.error);
    if(j.data&&num(j.data.savedAt)>0){if(confirm('Tu Sheet ya tiene información. ¿La traigo y reemplazo lo de este navegador?\n\nAceptar = traer de Sheets · Cancelar = subir lo de aquí')){await pull(false,true);toast('Conectado y sincronizado');return}}
    await push();render();toast('¡Conectado! Todo se guarda en tu Sheet')}
  catch(e){setSync('err');render();toast('No pude conectar. Revisa que la implementación tenga acceso "Cualquier persona"')}}

const GS_CODE=`/**
 * Mari Hub TA · guarda y lee la información de la página en este Google Sheet.
 * Implementar como Aplicación web · Ejecutar como: Yo · Acceso: Cualquier persona
 */
const COLLS = ['candidatos','search','entrevistas','tareas','equipo','skills','estrategias','jds'];

function doGet(e) {
  return json_(loadAll_());
}

function doPost(e) {
  try {
    const body = JSON.parse(e.postData.contents);
    if (body.action === 'save') {
      saveAll_(body.data || {});
      return json_({ ok: true, savedAt: body.data.savedAt });
    }
    return json_({ ok: false, error: 'Acción desconocida' });
  } catch (err) {
    return json_({ ok: false, error: String(err) });
  }
}

function saveAll_(d) {
  const lock = LockService.getScriptLock();
  lock.waitLock(20000);
  try {
    COLLS.forEach(function (k) { writeTable_('hub_' + k, d[k] || []); });
    const data = d.data || { headers: [], rows: [] };
    writeRaw_('hub_dashboard', data.headers && data.headers.length ? [data.headers].concat(data.rows) : []);
    const rest = {};
    Object.keys(d).forEach(function (k) {
      if (COLLS.indexOf(k) < 0 && k !== 'data') rest[k] = d[k];
    });
    rest.dataLoadedAt = data.loadedAt || '';
    writeRaw_('hub_config', Object.keys(rest).map(function (k) { return [k, JSON.stringify(rest[k])]; }));
  } finally {
    lock.releaseLock();
  }
}

function loadAll_() {
  const cfg = sheet_('hub_config').getDataRange().getValues();
  if (!cfg.length || cfg[0][0] === '') return { ok: true, data: null };
  const out = {};
  cfg.forEach(function (r) { if (r[0]) { try { out[r[0]] = JSON.parse(r[1]); } catch (e) {} } });
  COLLS.forEach(function (k) { out[k] = readTable_('hub_' + k); });
  const dash = sheet_('hub_dashboard').getDataRange().getValues();
  out.data = (dash.length > 1)
    ? { headers: dash[0].map(String), rows: dash.slice(1).map(function (r) { return r.map(String); }), loadedAt: out.dataLoadedAt || '' }
    : { headers: [], rows: [], loadedAt: '' };
  delete out.dataLoadedAt;
  return { ok: true, data: out };
}

function writeTable_(name, arr) {
  const keys = [];
  arr.forEach(function (o) { Object.keys(o).forEach(function (k) { if (keys.indexOf(k) < 0) keys.push(k); }); });
  const rows = arr.map(function (o) {
    return keys.map(function (k) {
      const v = o[k];
      return v == null ? '' : (typeof v === 'object' ? JSON.stringify(v) : String(v));
    });
  });
  writeRaw_(name, keys.length ? [keys].concat(rows) : []);
}

function writeRaw_(name, rows) {
  const sh = sheet_(name);
  sh.clearContents();
  if (!rows.length) return;
  const w = Math.max.apply(null, rows.map(function (r) { return r.length; }));
  const vals = rows.map(function (r) {
    const a = r.slice();
    while (a.length < w) a.push('');
    return a.map(function (v) { return v == null ? '' : String(v); });
  });
  const rg = sh.getRange(1, 1, vals.length, w);
  rg.setNumberFormat('@');
  rg.setValues(vals);
}

function readTable_(name) {
  const v = sheet_(name).getDataRange().getValues();
  if (v.length < 2) return [];
  const h = v[0];
  return v.slice(1)
    .filter(function (r) { return r.some(function (c) { return c !== ''; }); })
    .map(function (r) {
      const o = {};
      h.forEach(function (k, i) { if (k) o[k] = String(r[i]); });
      return o;
    });
}

function sheet_(name) {
  const ss = SpreadsheetApp.getActiveSpreadsheet();
  return ss.getSheetByName(name) || ss.insertSheet(name);
}

function json_(obj) {
  return ContentService.createTextOutput(JSON.stringify(obj)).setMimeType(ContentService.MimeType.JSON);
}
`;

/* ============ arranque ============ */
setSync();render();
if(S.settings.sheetsUrl)pull();
